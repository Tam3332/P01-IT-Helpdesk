# P01 SecDesk - Nginx Security Gateway (cổng duy nhất ra ngoài)
# Việc của gateway: TLS, header bảo mật, giới hạn tốc độ, chuyển /api/ sang backend và còn lại sang frontend.
# Địa chỉ backend/frontend viết bằng biến + resolver của Docker để Nginx vẫn khởi động được khi
# một dịch vụ khởi động chậm hoặc vừa được build lại.

worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    'rid=$request_id "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 30s;
    # Tệp đính kèm tối đa 10 MB (SRS HD04) cộng phần đệm của multipart
    client_max_body_size 11m;

    # DNS nội bộ của Docker
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Giới hạn tốc độ: đăng nhập chặt hơn (chống dò mật khẩu), API chung rộng hơn
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
    limit_req_status 429;

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 10m;

        # Header bảo mật (CSP cho phép Google Fonts mà giao diện đang dùng)
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # Không đưa tài liệu API ra ngoài qua gateway
        location ~ ^/(v3/api-docs|swagger-ui) { return 404; }

        # Đăng nhập: giới hạn chặt
        location = /api/v1/auth/login {
            limit_req zone=login burst=5 nodelay;
            set $backend http://backend:8080;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $request_id;
            proxy_read_timeout 60s;
        }

        # API còn lại
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            set $backend http://backend:8080;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $request_id;
            proxy_read_timeout 60s;
        }

        # Giao diện
        location / {
            set $frontend http://frontend:80;
            proxy_pass $frontend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $request_id;
            proxy_read_timeout 60s;
        }
    }
}
