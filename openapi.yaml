        '404':
          $ref: '#/components/responses/404NotFound'

  # ================= DASHBOARD =================
  /dashboard/stats:
    get:
      tags: [Dashboard]
      summary: "[Chưa triển khai – tuần 4] Thống kê tổng hợp số lượng vé, vi phạm SLA, hiệu năng (HD14)"
      description: >
        Trả về thống kê tổng quan: tổng số vé theo trạng thái, số vé vi phạm SLA,
        thời gian xử lý trung bình. Dành riêng cho IT_MANAGER.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Thống kê tổng hợp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStatsResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /dashboard/sla-monitor:
    get:
      tags: [Dashboard]
      summary: "[Chưa triển khai – tuần 4] Giám sát vé sắp chạm ngưỡng cảnh báo 80% hoặc quá hạn SLA (HD12, HD14)"
      description: >
        Danh sách vé đang tiến gần đến ngưỡng SLA (>= 80% thời gian deadline)
        hoặc đã vi phạm SLA (is_sla_breached = true). Dành riêng cho IT_MANAGER.
      security:
        - BearerAuth: []
      parameters:
        - name: breachedOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: "true = chỉ lấy vé đã vi phạm SLA; false = lấy cả vé sắp vi phạm"
      responses:
        '200':
          description: Danh sách vé cần giám sát SLA
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SLAMonitorItem'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DashboardStatsResponse:
      type: object
      description: Thống kê tổng hợp cho IT_MANAGER (HD14)
      properties:
        totalTickets:
          type: integer
          description: Tổng số vé trong hệ thống
        byStatus:
          type: object
          description: Số lượng vé theo từng trạng thái
          additionalProperties:
            type: integer
          example:
            NEW: 5
            ASSIGNED: 3
            IN_PROGRESS: 2
            RESOLVED: 8
            CLOSED: 12
        slaBreachedCount:
          type: integer
          description: Số vé đã vi phạm SLA
        slaBreachedPct:
          type: number
          format: double
          description: "% vé vi phạm SLA trên tổng số"
        avgResolutionHours:
          type: number
          format: double
          description: Thời gian giải quyết trung bình (giờ)

    SLAMonitorItem:
      type: object
      description: Thông tin vé cần giám sát SLA (HD12)
      properties:
        ticketId:
          type: integer
        ticketNumber:
          type: string
          example: HD-2026-0001
        title:
          type: string
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        status:
          type: string
        resolutionDeadline:
          type: string
          format: date-time
        slaUsedPct:
          type: number
          format: double
          description: "% thời gian SLA đã dùng (>= 80 = cảnh báo, >= 100 = vi phạm)"
        isSlaBreached:
          type: boolean
        assigneeName:
          type: string
          nullable: true

    ReopenRequestDTO:
      type: object
      description: Bản ghi yêu cầu mở lại ticket, tương ứng bảng reopen_requests trong ERD
      properties:
        id:
          type: integer
          example: 7
        ticketId:
          type: integer
          example: 42
        ticketNumber:
          type: string
          example: HD-2026-0042
        requesterId:
          type: integer
          example: 3
        requesterName:
          type: string
          example: Nguyễn Văn A
        reopenReason:
          type: string
          example: Mạng vẫn tiếp tục bị chập chờn rớt gói tin sau 15 phút cắm lại dây.
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
          example: PENDING
        reviewedBy:
          type: integer
          nullable: true
          example: null
        reviewNote:
          type: string
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Thao tác thực hiện thành công
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: TICKET_NOT_FOUND
            message:
              type: string
              example: Không tìm thấy tài nguyên hoặc không có quyền truy cập
            details:
              type: array
              items:
                type: string
        timestamp:
          type: string
          format: date-time

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          example: 900
        user:
          $ref: '#/components/schemas/UserResponse'

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: employee1
        email:
          type: string
          example: employee1@fpt.edu.vn
        fullName:
          type: string
          example: Phạm Nguyễn Minh Trí
        role:
          type: string
          example: EMPLOYEE
        department:
          type: string
          example: Phòng Đào Tạo
        isActive:
          type: boolean
          example: true

    AttachmentDTO:
      type: object
      description: Metadata tệp đính kèm, tương ứng bảng ticket_attachments (không trả storage_path)
      properties:
        id:
          type: integer
        fileName:
          type: string
          example: loi_man_hinh.png
        fileSize:
          type: integer
          example: 245760
        mimeType:
          type: string
          example: image/png
        ticketId:
          type: integer
        uploaderId:
          type: integer
        uploaderName:
          type: string
        createdAt:
          type: string
          format: date-time

    FeedbackDTO:
      type: object
      description: Đánh giá CSAT, tương ứng bảng ticket_feedbacks
      properties:
        ticketId:
          type: integer
        ratingStars:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        feedbackComment:
          type: string
          example: Kỹ thuật viên hỗ trợ rất nhiệt tình, nhanh chóng.
        createdAt:
          type: string
          format: date-time

    TicketDTO:
      type: object
      description: Một dòng ticket trong danh sách (GET /tickets) và kết quả tạo ticket (POST /tickets)
      properties:
        id:
          type: integer
        ticketNumber:
          type: string
        title:
          type: string
        description:
          type: string
        categoryName:
          type: string
        impactLevel:
          type: string
          enum: &id001
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
        priority:
          type: string
          enum: *id001
        status:
          type: string
          enum: &id002
            - NEW
            - ASSIGNED
            - IN_PROGRESS
            - RESOLVED
            - CLOSED
            - REOPENED
            - REOPEN_PENDING
        requesterName:
          type: string
        assigneeId:
          type: integer
          nullable: true
        assigneeName:
          type: string
          nullable: true
        responseDeadline:
          type: string
          format: date-time
        resolutionDeadline:
          type: string
          format: date-time
        isSlaBreached:
          type: boolean
          description: "Trễ hạn xử lý, tính tại thời điểm Resolved (SRS §5 BR-HD-03)"
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    TicketDetailDTO:
      type: object
      description: Chi tiết ticket (GET /tickets/{id}, kết quả phân công, đổi trạng thái, đóng ticket)
      properties:
        id:
          type: integer
        ticketNumber:
          type: string
        title:
          type: string
        description:
          type: string
        categoryId:
          type: integer
        categoryCode:
          type: string
        categoryName:
          type: string
        impactLevel:
          type: string
          enum: *id001
        priority:
          type: string
          enum: *id001
        status:
          type: string
          enum: *id002
        requesterId:
          type: integer
        requesterName:
          type: string
        requesterEmail:
          type: string
        requesterDepartment:
          type: string
        assigneeId:
          type: integer
          nullable: true
        assigneeName:
          type: string
          nullable: true
        assigneeEmail:
          type: string
          nullable: true
        responseDeadline:
          type: string
          format: date-time
        resolutionDeadline:
          type: string
          format: date-time
        isSlaBreached:
          type: boolean
        firstRespondedAt:
          type: string
          format: date-time
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        reopenedAt:
          type: string
          format: date-time
          nullable: true
        reopenCount:
          type: integer
        reopenReason:
          type: string
          nullable: true
        resolutionNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NotificationDTO:
      type: object
      description: Một thông báo cho chuông thông báo (GET /notifications)
      properties:
        id:
          type: integer
        ticketId:
          type: integer
        ticketNumber:
          type: string
        title:
          type: string
        status:
          type: string
        action:
          type: string
        actorName:
          type: string
        timestamp:
          type: string
          format: date-time
    TicketPage:
      type: object
      description: 'Trang kết quả danh sách ticket (HD13: 20 dòng/trang, có tổng số kết quả)'
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TicketDTO'
        pageNo:
          type: integer
          description: Trang hiện tại, bắt đầu từ 0
        pageSize:
          type: integer
          example: 20
        totalElements:
          type: integer
        totalPages:
          type: integer
        last:
          type: boolean
    CommentDTO:
      type: object
      description: Bình luận, tương ứng bảng ticket_comments
      properties:
        id:
          type: integer
        ticketId:
          type: integer
        authorId:
          type: integer
        commentText:
          type: string
        isInternal:
          type: boolean
        createdAt:
          type: string
          format: date-time
    CategoryDTO:
      type: object
      description: Danh mục, tương ứng bảng ticket_categories
      properties:
        id:
          type: integer
        categoryCode:
          type: string
        categoryName:
          type: string
        defaultPriority:
          type: string
          enum: *id001
        isActive:
          type: boolean
    SlaConfigDTO:
      type: object
      description: Định mức SLA, tương ứng bảng sla_configs
      properties:
        priorityLevel:
          type: string
          enum: *id001
        responseTimeHours:
          type: number
        resolutionTimeHours:
          type: number
        updatedAt:
          type: string
          format: date-time
    HistoryDTO:
      type: object
      description: Một dòng nhật ký, tương ứng bảng ticket_history (không trả ip_address cho client)
      properties:
        id:
          type: integer
        ticketId:
          type: integer
        actorId:
          type: integer
        actorName:
          type: string
        action:
          type: string
          description: CREATE, ASSIGN, REASSIGN, STATUS_CHANGE, COMMENT, SLA_WARNING, SLA_BREACH, REOPEN_REQUEST, REOPEN_APPROVE, REOPEN_REJECT, CLOSE
          example: STATUS_CHANGE
        fieldChanged:
          type: string
          nullable: true
        oldValue:
          type: string
          nullable: true
        newValue:
          type: string
          nullable: true
        reasonOrNote:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
    UserPage:
      type: object
      description: Trang danh sách tài khoản
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page:
          type: integer
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
        totalPages:
          type: integer
  responses:
    400BadRequest:
      description: Dữ liệu gửi lên sai định dạng hoặc vi phạm ràng buộc DTO validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    401Unauthorized:
      description: Thiếu token hoặc token đã hết hạn / bị thu hồi khi đăng xuất
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    403Forbidden:
      description: Người dùng không có vai trò (Role) phù hợp để thực thi API này
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    404NotFound:
      description: Tài nguyên không tồn tại hoặc cơ chế Anti-IDOR chặn che giấu sự tồn tại
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
