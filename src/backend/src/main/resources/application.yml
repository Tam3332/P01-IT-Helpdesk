server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: p01-backend
  # Tắt user tạm Spring tự sinh ("Using generated security password"): hệ thống xác thực bằng JWT
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/p01_db}
    username: ${SPRING_DATASOURCE_USERNAME:p01_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration (15 phut)
jwt:
  secret: ${JWT_SECRET:21727172a7109d0ac9be8f1d0218a074fbca17c87ae295ce237947e5562c9691}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
