# Nginx trong container Frontend: phục vụ SPA React.
# TLS, rate limit và security headers do Nginx gateway (nginx/nginx.conf) xử lý.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # File build có hash trong tên nên cache lâu được
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: mọi đường dẫn khác trả về index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
